<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030a" />
    <meta name="description" content="Play god with the solar system. Real N-body gravity, pool-cue launches from asteroids to black holes, and the Sun's corkscrew ride through the Milky Way." />
    <meta property="og:title" content="God Mode · Solar System Sandbox" />
    <meta property="og:description" content="Throw black holes at the solar system. Real gravity, in your browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>God Mode · Solar System Sandbox</title>
  </head>
  <body>
    <div id="stage"></div>

    <header class="topbar">
      <div class="brand"><span class="logo"></span><span class="brand-text">GOD<b>MODE</b></span></div>
      <nav class="seg" id="views" aria-label="View">
        <button data-view="solar" class="on">Solar</button>
        <button data-view="helix">Helix</button>
        <button data-view="galaxy">Milky Way</button>
      </nav>
      <div class="top-actions">
        <button id="btn-missions" class="pill" aria-label="Trick shots">🎯<span>Trick shots</span></button>
        <button id="btn-trophy" class="icon" aria-label="Achievements">🏆</button>
        <button id="btn-sound" class="icon" aria-label="Sound">🔇</button>
        <button id="btn-help" class="icon desktop-only" aria-label="How to play">?</button>
        <button id="btn-menu" class="icon" aria-label="Menu">☰</button>
      </div>
    </header>

    <section id="telemetry" class="telemetry hud" aria-live="off"></section>
    <canvas id="radar" class="hud" aria-label="Radar: top-down map of the system"></canvas>
    <div id="mission-hud" class="hud" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <aside id="rail" aria-label="Camera and overlays"></aside>
    <section id="info" class="hud" hidden></section>
    <div id="ticker"></div>

    <footer class="dock">
      <div id="aimbar" class="hud" hidden></div>
      <div class="timebar hud">
        <button id="btn-rewind" class="tb" aria-label="Rewind to last shot" title="Rewind to last shot (R)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="btn-play" class="tb play" aria-label="Pause"></button>
        <button id="btn-stop" class="tb" aria-label="Stop and save" title="Stop and save"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
        <input id="speed" type="range" min="0" max="1" step="0.001" aria-label="Simulation speed" />
        <span id="speed-label" class="mono"></span>
      </div>
      <div id="arsenal" class="arsenal" aria-label="Arsenal"></div>
      <div class="galaxy-caption">The Sun's lap around the Milky Way. Orange markers are Earth's great extinctions, pinned where the Sun was when they happened.</div>
    </footer>

    <div id="modal-root"></div>
    <div id="drop-hint">Drop a save file to load it</div>
    <div id="loading"><div class="spinner"></div><p>Forming planets…</p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
